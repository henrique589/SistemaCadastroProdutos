server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API e documentação ficam no backend; o nome "backend" é resolvido pela rede do docker-compose.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; }
    location /swagger-ui/     { proxy_pass http://backend:8080/swagger-ui/; }
    location /v3/api-docs     { proxy_pass http://backend:8080/v3/api-docs; }

    # Rotas do Angular (SPA): qualquer caminho desconhecido volta para o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
